[profile.default]
solc-version = '0.8.22'
src = 'src'
out = 'out'
libs = ['lib']

fs_permissions = [{ access = 'read', path = './' }]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
# Deterministic (CREATE2) deployments: every setting that affects bytecode is pinned,
# so the same commit produces the same addresses on every chain.
[profile.create2]
solc = '0.8.22'
optimizer = true
optimizer_runs = 200
evm_version = 'paris'
bytecode_hash = 'none'
cbor_metadata = false
